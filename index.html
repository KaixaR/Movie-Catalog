<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e0d12;--soft:#17151c;--ink:#f3f0ea;--dim:#9a948c;--line:#2a2731;--gold:#e4b363;color-scheme:dark}
*{box-sizing:inherit}html,body{margin:0}body{background:radial-gradient(1200px 600px at 50% -10%,#1b1824 0,transparent 60%),var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{max-width:1200px;margin:0 auto;padding:52px 22px 20px}h1{font-family:Fraunces,serif;font-weight:900;font-size:clamp(2.2rem,6vw,3.6rem);margin:0;letter-spacing:-.01em}
.sub{color:var(--dim);margin:12px 0 0;max-width:52ch;line-height:1.5}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;max-width:1200px;margin:18px auto 0;padding:0 22px}
.search{flex:1 1 220px;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:11px 18px;color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--gold);border-color:transparent}.count{color:var(--dim);font-size:.86rem;white-space:nowrap}
.pills{display:flex;gap:8px;flex-wrap:wrap;max-width:1200px;margin:14px auto 0;padding:0 22px}
.pill{background:var(--soft);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--gold);color:#1a1205;border-color:transparent;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:26px 22px 70px}
.sec h2{font-family:Fraunces,serif;font-weight:600;font-size:1.3rem;margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{text-decoration:none;color:inherit;display:block;transition:transform .18s}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:12px}
@media(hover:hover){.card:hover{transform:translateY(-6px)}}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:13px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8))}
.poster .ph{position:relative;z-index:1;font-family:Fraunces,serif;font-weight:600;font-size:1.02rem;line-height:1.1}
.imdb{position:absolute;top:10px;left:10px;z-index:2;background:var(--gold);color:#1a1205;font-weight:600;font-size:.6rem;letter-spacing:.05em;padding:3px 7px;border-radius:5px}
.meta{margin:9px 2px 0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}.m-t{font-size:.88rem;line-height:1.2}.m-y{color:var(--dim);font-size:.8rem;flex:none}
.empty{color:var(--dim);text-align:center;padding:50px 0}footer{max-width:1200px;margin:0 auto;padding:24px 22px 50px;color:var(--dim);font-size:.8rem;border-top:1px solid var(--line)}
</style></head><body>

document.querySelector("h1").textContent=CFG.title;document.querySelector(".sub").textContent=CFG.sub;
let active="all";const main=document.getElementById("main"),q=document.getElementById("q"),count=document.getElementById("count"),pills=document.getElementById("pills");
const countries=[...new Set(DATA.map(d=>d.c))];
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return Math.abs(h)}
function ph(t){const h=hash(t);return "linear-gradient(160deg,hsl("+(h%360)+" 30% 30%),hsl("+(h%360)+" 40% 10%))"}
function card(d){const img=d.img?('<img loading="lazy" src="'+d.img+'" alt=""><div class="ov"></div>'):('<div class="ph" style="position:absolute;inset:0;background:'+ph(d.t)+'"></div><span class="ph">'+d.t+'</span>');
return '<a class="card" href="'+d.link+'" target="_blank" rel="noopener"><div class="poster"><span class="imdb">IMDb</span>'+img+'</div><div class="meta"><span class="m-t">'+d.t+'</span>'+(CFG.year&&d.y?'<span class="m-y">'+d.y+'</span>':'')+'</div></a>'}
function render(){const term=q.value.trim().toLowerCase();let list=DATA.filter(d=>d.t.toLowerCase().includes(term));if(active!=="all")list=list.filter(d=>d.c===active);
count.textContent=list.length+" film"+(list.length===1?"":"s");
if(!list.length){main.innerHTML='<p class="empty">No films match.</p>';return}
if(CFG.group&&active==="all"){let html="";countries.forEach(c=>{const g=list.filter(d=>d.c===c);if(!g.length)return;html+='<section class="sec"><h2>'+(g[0].cl||c)+' <span style="color:var(--dim);font-weight:400">('+g.length+')</span></h2><div class="grid">'+g.map(card).join("")+'</div></section>'});main.innerHTML=html}
else{main.innerHTML='<div class="grid">'+list.map(card).join("")+'</div>'}}
function buildPills(){let h='<button class="pill" data-c="all" aria-pressed="true">All</button>';countries.forEach(c=>{const d=DATA.find(x=>x.c===c);h+='<button class="pill" data-c="'+c+'" aria-pressed="false">'+(d.cl||c)+'</button>'});pills.innerHTML=h;
pills.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.c;pills.querySelectorAll(".pill").forEach(x=>x.setAttribute("aria-pressed",x===b));render()}))}
q.addEventListener("input",render);buildPills();render();
