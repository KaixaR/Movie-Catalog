<style>

.wprow{display:flex;gap:10px;align-items:center;margin-top:10px}.wbtn{background:var(--gold);color:#1a1205;border:none;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.wbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}#wStat{color:var(--dim);font-size:.82rem}
.card.watched .poster{opacity:.55}.wbadge{position:absolute;top:10px;right:10px;z-index:2;background:var(--ok);color:#06210f;font-weight:700;font-size:.7rem;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.sec h2{scroll-margin-top:12px}

.card{cursor:pointer}

ared of him. Taiga has red hair and piercing eyes. His appearance gives off the impression that he is a bad boy, but he is actually considerate to others and good at cooking. After getting to know Taiga, Nao begins to have feelings for him.","tag":"","r":"7.7","rt":"105","cert":"","dir":[],"co":[],"cast":[],"ot":"honey","im":"tt6861402","tm":"515596","gw":0,"tw":0},{"t":"Honey Lemon Soda","y":"2021","c":"JP","cl":"Japan","img":"covers/jp-honey-lemon-soda-2021.jpg","remote":false,"link":"https://www.imdb.com/title/tt14311250/","g":["Romance","Comedy","Drama"],"a":"","coll":"","p":"Ishimori Uka is very shy and has a hard time making friends. When she was a middle school student, students made fun of her by calling her \"stone\". Around that time, she met Miura Kai with lemon color hair. Because of him, she entered the same high school. Uka now wants to overcome her shyness and have friends. Kai is a popular student at the school, but he doesn't talk much or seem interested in others. He doesn't know why, but he becomes concerned with Uka. Uka has admired Kai, and she now has feelings for him. Kai has a secret, which no one knows.","tag":"","r":"8","rt":"111","cert":"","dir":[],"co":[],"cast":[],"ot":"ハニーレモンソーダ","im":"tt14311250","tm":"853821","gw":0,"tw":0},{"t":"Honto ni Atta Kowai Hanashi","y":"2011","c":"JP","cl":"Japan","img":"covers/jp-honto-ni-atta-kowai-hanashi-2011.jpg","remote":false,"link":"https://www.imdb.com/title/tt2028495/","g":["TV Movie","Horror"],"a":"","coll":"","p":"While Suzaki Saika (Ashida Mana) is hospitalised for poor health, her father, Tamotsu (Totsugi Shigeyuki) feels torn that he has to leave here and go on a business trip. A portrait of Saika’s late mother is placed beside her bed. Her mother had died in exchange for bringing her into this world. Tamotsu puts a paper with his mobile phone number written on it inside an amulet and hands it to Saika. He asks the nurse Tokunaga Maki (Minamisawa Nao) to keep an eye on Saika, and leaves for hi n, and the third an elderly man celebrating his wife's birthday. A middle aged detective investigating one of the cases begins to suspect a connection between the three when he discovers that each person mentioned a \"green monkey\" before they died. With the help of a young psychiatrist he formulates the theory that hypnosis is somehow involved. In the mean time other bizarre \"suicides\" are reported and the mystery intensifies. Who will be next? What is the truth? Can more deaths be prevented?","tag":"","r":"6.696","rt":"110","cert":"","dir":[],"co":[],"cast":[],"ot":"催眠","im":"tt0228807","tm":"68477","gw":0,"tw":0},{"t":"I Am a Hero","y":"2016","c":"JP","cl":"Japan","img":"covers/jp-i-am-a-hero-2016.jpg","remote":false,"link":"https://www.imdb.com/title/tt3775202/","g":["Action","Horror","Drama"],"a":17,"coll":"","p":"A man witnesses a fatal traffic accident on his way home from work, and the victim is clearly killed on impact. A moment later, when the corpse stands up and walks away, it could be a hallucination or something far more extraordinary.","tag":"","r":"7.478","rt":"126","cert":"GB-R","dir":[],"co":[],"cast":[],"ot":"アイアムアヒーロー","im":"tt3775202","tm":"276624","gw":0,"tw":0},{"t":"Idol Sniper NEO","y":"2019","c":"JP","cl":"Japan","img":"covers/jp-idol-sniper-neo-2019.jpg","remote":false,"link":"https://www.imdb.com/title/tt13598456/","g":[],"a":"","coll":"","p":"There are two sides to Sayaka Ichimonji: she's a bubbly pop idol and a bloodthirsty sniper. She's been sent as an assassin to a secret ring of hitmen called Destiny. She´s been assigned the killing of Himuro, the biggest gun trafficker in all of Japan.","tag":"","r":"","rt":"72","cert":"","dir":[],"co":[],"cast":[],"ot":"アイドルスナイパーNEO","im":"tt13598456","tm":"770988","gw":0,"tw":0},{"t":"If You Count to Five It's Your Dream","y":"2014","c":"JP","cl":"Japan","img":"covers/jp-if-you-count-to-five-it-s-your-dream-2014.jpg","remote":false,"link":"https://www.imdb.com/title/tt3299064/","g":["Drama","Ro ll over her face. Overwhelmed by physical and psychological trauma, Mayu sinks deeper into depression and isolation, unresponsive to her sisters encouragement. Meanwhile, chilling news of a serial murderer, who preys on the alumni of Mayu's high school, sends shockwaves through their small town...","tag":"","r":"5.8","rt":"98","cert":"","dir":[],"co":[],"cast":[],"ot":"口裂け女2","im":"tt1192612","tm":"79278","gw":0,"tw":0},{"t":"Kuchisake-onna Returns","y":"2012","c":"JP","cl":"Japan","img":"covers/jp-kuchisake-onna-returns-2012.jpg","remote":false,"link":"https://www.imdb.com/title/tt2393853/","g":["Horror"],"a":"","coll":"Kuchisake-onna","p":"Airi is a graduate student with a degree in the study of folklore. As part of her research, she decided to go to a small village with a group of friends, to investigate local legends. She does not know that the people worshiped the Slit-Mouthed woman as a living god, and intend to use her and her friends as a human sacrifice. In the end, Airi is injured and decides to fight, becoming a Slit-Mouth hunter.”","tag":"","r":"0.5","rt":"74","cert":"","dir":[],"co":[],"cast":[],"ot":"口裂け女 リターンズ","im":"tt2393853","tm":"432989","gw":0,"tw":0},{"t":"Kurosagi The Black Swindler","y":"2008","c":"JP","cl":"Japan","img":"covers/jp-kurosagi-the-black-swindler-2008.jpg","remote":false,"link":"https://www.imdb.com/title/tt1159502/","g":["Crime","Drama","Thriller","Action"],"a":"","coll":"","p":"There are three kinds of swindler. One, called the \"WHITE SWINDLER\", finds a mark and steals money. The \"RED SWINDLER\" preys on the other sex and steals a mark's body and soul. Then there is the \"BLACK SWINDLER\". Ignoring ordinary marks, targeting only the white and red swindlers, and preying on their flesh grown fat and corrupt with the money they have stolen, he is the worst of them all.  There is a boy who once became a victim of a swindler and lost his family. Later, he turns into the most hideous \"black swindler\" to deceive only other swindle road. Ayaka Morikawa and Ryouma Baba, who have starred in the whole series, play Aya and Tairaku respectively, and Sena Natsuki, a gravure idol, plays the role of May who is in a triangular relationship with the two.","tag":"","r":"","rt":"92","cert":"","dir":[],"co":[],"cast":[],"ot":"教科書にないッ！6","im":"tt11371700","tm":"709695","gw":0,"tw":0},{"t":"Not Quite Dead Yet","y":"2020","c":"JP","cl":"Japan","img":"covers/jp-not-quite-dead-yet-2020.jpg","remote":false,"link":"https://www.imdb.com/title/tt10993580/","g":["Comedy"],"a":"","coll":"","p":"After Nanase's father drops dead due to a drug that causes temporal death for 2 days, she is named the president of his pharmaceutical company. Nanase endeavors to prevent her father's enemies from prematurely cremating his body before the drug can wear off and allow him to revive.","tag":"","r":"6","rt":"93","cert":"","dir":[],"co":[],"cast":[],"ot":"一度死んでみた","im":"tt10993580","tm":"669663","gw":0,"tw":0},{"t":"Occult","y":"2009","c":"JP","cl":"Japan","img":"covers/jp-occult-2009.jpg","remote":false,"link":"https://www.imdb.com/title/tt1395135/","g":["Horror","Mystery","Thriller","Science Fiction"],"a":"","coll":"","p":"Koji Shiraishi interviews the survivors of an indiscriminate attack at a sightseeing resort and starts investigating the strange events that have been happening to them.","tag":"","r":"6.701","rt":"110","cert":"","dir":[],"co":[],"cast":[],"ot":"オカルト","im":"tt1395135","tm":"118315","gw":1,"tw":0},{"t":"Occult Bolshevism","y":"2018","c":"JP","cl":"Japan","img":"covers/jp-occult-bolshevism-2018.jpg","remote":false,"link":"https://www.imdb.com/title/tt7481212/","g":["Horror"],"a":"","coll":"","p":"A film that takes the theme of psycho-phobia. The film visualizes a forbidden psychic experiment that is a \"departing\" process to a world of madness, aimed at \"spiritual revolution\".","tag":"","r":"5.8","rt":"72","cert":"","dir":[],"co":[],"cast":[],"ot":"霊的ボリシェヴィキ","im":"tt7481212","tm":"519339","gw":0,"tw":0},{"t" /jp-talk-to-the-dead-2013.jpg","remote":false,"link":"https://www.imdb.com/title/tt2709636/","g":["Drama","Horror"],"a":"","coll":"","p":"Having lost her beloved father at an early age, Yuri lives with her mother and younger brother. Yuri's mother meets a new man, but they are deeply in debt and forced to leave their home. Yuri is then forced to take a job as a call girl to support her brother. One day Yuri's brother becomes ill but since Yuri has to work, she unwillingly leaves him at home. When she returns, she finds him dead in the bathtub. Her heart is scarred with regret and she suffers with a pain that will never go away. After some time has passed, Mayu, a colleague of Yuri's, tells her about a mysterious mobile app that is rumored to enable its user to talk to the dead. Yet, it comes with a warning: Never reply if the dead soul says, \"I want to see you.\" Because she blames herself for her brother's death and will do anything to tell him how sorry she is, Yuri downloads the app and reaches out to her dead brother. Meanwhile, the app's users begin to die.","tag":"","r":"5.4","rt":"84","cert":"","dir":[],"co":[],"cast":[],"ot":"トーク・トゥ・ザ・デッド","im":"tt2709636","tm":"219508","gw":0,"tw":0},{"t":"TAP Perfect Education","y":"2013","c":"JP","cl":"Japan","img":"covers/jp-tap-perfect-education-2013.jpg","remote":false,"link":"https://www.imdb.com/title/tt3131876/","g":["Thriller"],"a":"","coll":"","p":"In Okinawa, a down-and-out middle-aged yakuza underling named Shidara kidnaps and confines a high school girl named Yui, the daughter of a fellow yakuza’s mistress.","tag":"","r":"6","rt":"106","cert":"","dir":[],"co":[],"cast":[],"ot":"TAP 完全なる飼育","im":"tt3131876","tm":"327104","gw":0,"tw":0},{"t":"Tea Fight","y":"2008","c":"JP","cl":"Japan","img":"covers/jp-tea-fight-2008.jpg","remote":false,"link":"https://www.imdb.com/title/tt1051267/","g":["Drama"],"a":"","coll":"","p":"A descendant of an ancient tea tribe heads to Taiwan to look for the legendary black tea to break the curse of a tribal rivalry. Meanwhile, in an \"underground tea market\" somewhere in Taiwan that sells rare expensive tea from around the world, tribe members have other motives up their sleeves regarding the black tea legacy. Each for their own cause, rival tribal members become tangled up in a web of love and hate.","tag":"","r":"5.5","rt":"102","cert":"","dir":[],"co":[],"cast":[],"ot":"闘茶","im":"tt1051267","tm":"293885","gw":0,"tw":0},{"t":"Teke Teke","y":"2009","c":"JP","cl":"Japan","img":"covers/jp-teke-teke-2009.jpg","remote":false,"link":"https://www.imdb.com/title/tt1395146/","g":["Horror"],"a":"","coll":"","p":"The upper torso of a female, claws her way around Japan searching for her lower half. The person's lower half was severed in a train accident in Hokkaido. Anyone that hears of this story will see Teke-Teke's upper half walking aimlessly around the countryside within three days.","tag":"","r":"6","rt":"70","cert":"","dir":[],"co":[],"cast":[],"ot":"テケテケ","im":"tt1395146","tm":"101981","gw":0,"tw":0},{"t":"Teke Teke 2","y":"2009","c":"JP","cl":"Japan","img":"covers/jp-teke-teke-2-2009.jpg","remote":false,"link":"https://www.imdb.com/title/tt1395147/","g":["Horror"],"a":"","coll":"","p":"The story of Teke Teke, the ghost woman with no legs, continues. Conflict arises between a group of high school classmates, and Teke Teke starts hunting them down one by one.","tag":"","r":"5.8","rt":"73","cert":"","dir":[],"co":[],"cast":[],"ot":"テケテケ2","im":"tt1395147","tm":"101987","gw":0,"tw":0},{"t":"Ten Nights of Dreams","y":"2007","c":"JP","cl":"Japan","img":"covers/jp-ten-nights-of-dreams-2007.jpg","remote":false,"link":"https://www.imdb.com/title/tt0899224/","g":["Fantasy","Horror"],"a":"","coll":"","p":"Based on renowned Japanese writer Natsume Soseki's same-titled short story collection, Ten Nights of Dreams brings ten fantastical dream sequences to film with great visual and psychological panache. Representing the combined efforts of eleven directors, azrail.addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.disabled)return;var s=document.getElementById("L-"+b.dataset.l);if(s)s.scrollIntoView({behavior:"smooth",block:"start"})});
function render(){const term=q.value.trim().toLowerCase();let list=DATA.filter(d=>d.t.toLowerCase().includes(term)||(d.coll&&d.coll.toLowerCase().includes(term)));if(active!=="all")list=list.filter(d=>d.c===active);
if(hideWatched)list=list.filter(d=>!(d.gw||watched.has(wnorm(d.t))));
if(picksView)list=list.filter(d=>picks.has(pickKey(d)));
if(toWatchView)list=list.filter(d=>d.tw);
const gf=genreSel.value;if(gf)list=list.filter(d=>(d.g||[]).indexOf(gf)>-1);
const yf=yearSel.value;if(yf)list=list.filter(d=>{const y=parseInt(d.y,10);return y&&Math.floor(y/10)*10===+yf});
const af=ageSel.value;if(af==="h18")list=list.filter(d=>d.a===""||d.a<18);else if(af==="h18u")list=list.filter(d=>d.a!==""&&d.a<18);else if(af==="only18")list=list.filter(d=>d.a!==""&&d.a>=18);
count.textContent=list.length+" film"+(list.length===1?"":"s");
if(!list.length){main.innerHTML='<p class="empty">No films match.</p>';azrail.hidden=true;return}
if(viewSel.value==="az"){const key=d=>(d.t||"").replace(/^(the|a|an)\s+/i,"");
const sorted=list.slice().sort((a,b)=>key(a).localeCompare(key(b),undefined,{numeric:true,sensitivity:"base"}));
const groups={},order=[];sorted.forEach(d=>{let L=key(d).charAt(0).toUpperCase();if(!/[A-Z]/.test(L))L="#";if(!groups[L]){groups[L]=[];order.push(L)}groups[L].push(d)});
order.sort((a,b)=>a==="#"?-1:b==="#"?1:a.localeCompare(b));
main.innerHTML=order.map(L=>'<section class="sec" id="L-'+L+'"><h2>'+L+' <span style="color:var(--dim);font-weight:400">('+groups[L].length+')</span></h2><div class="grid">'+groups[L].map(card).join("")+'</div></section>').join("");buildRail(order);return}
if(viewSel.value==="coll"){azrail.hidden=true;const wc=list.filter(d=>d.coll);if(!wc.length){main.innerHTML='<p class="empty">No collections match the current filters.</p>';return}
const cg={},co=[];wc.forEach(d=>{if(!cg[d.coll]){cg[d.coll]=[];co.push(d.coll)}cg[d.coll].push(d)});co.sort((a,b)=>a.localeCompare(b));
co.forEach(k=>cg[k].sort((a,b)=>((parseInt(a.y,10)||0)-(parseInt(b.y,10)||0))||a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})));
main.innerHTML=co.map(k=>'<section class="sec"><h2>'+k+' <span style="color:var(--dim);font-weight:400">('+cg[k].length+')</span></h2><div class="grid">'+cg[k].map(card).join("")+'</div></section>').join("");return}
azrail.hidden=true;
if(CFG.group&&active==="all"){let html="";countries.forEach(c=>{const g=list.filter(d=>d.c===c);if(!g.length)return;html+='<section class="sec"><h2>'+(g[0].cl||c)+' <span style="color:var(--dim);font-weight:400">('+g.length+')</span></h2><div class="grid">'+g.map(card).join("")+'</div></section>'});main.innerHTML=html}
else{main.innerHTML='<div class="grid">'+list.map(card).join("")+'</div>'}}
function buildPills(){let h='<button class="pill" data-c="all" aria-pressed="true">All</button>';countries.forEach(c=>{const d=DATA.find(x=>x.c===c);h+='<button class="pill" data-c="'+c+'" aria-pressed="false">'+(d.cl||c)+'</button>'});pills.innerHTML=h;
pills.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.c;pills.querySelectorAll(".pill").forEach(x=>x.setAttribute("aria-pressed",x===b));render()}))}
(function(){const gs=[...new Set(DATA.flatMap(d=>d.g||[]))].sort((a,b)=>a.localeCompare(b));if(gs.length){genreSel.hidden=false;genreSel.innerHTML='<option value="">All genres</option>'+gs.map(g=>'<option value="'+g+'">'+g+'</option>').join("")}
const ds=[...new Set(DATA.map(d=>parseInt(d.y,10)).filter(Boolean).map(y=>Math.floor(y/10)*10))].sort((a,b)=>b-a);if(ds.length){yearSel.hidden=false;yearSel.innerHTML='<option value="">All decades</option>'+ds.map(d=>'<option value="'+d+'">'+d+'s</option>').join("")}})();
q.addEventListener("input",render);genreSel.addEventListener("change",render);yearSel.addEventListener("change",render);ageSel.addEventListener("change",render);viewSel.addEventListener("change",render);buildPills();render();
const wToggle=document.getElementById("wToggle"),wEdit=document.getElementById("wEdit"),wPanel=document.getElementById("wPanel"),wTa=document.getElementById("wTa"),wSave=document.getElementById("wSave"),wClear=document.getElementById("wClear"),wStat=document.getElementById("wStat");
function wcount(){return DATA.filter(d=>watched.has(wnorm(d.t))).length}
function wsave(txt){watchedRaw=txt.split("\n").map(s=>s.trim()).filter(Boolean);watched=new Set(watchedRaw.map(wnorm));try{localStorage.setItem(WKEY,JSON.stringify(watchedRaw))}catch(e){}}
wToggle.onclick=()=>{hideWatched=!hideWatched;wToggle.setAttribute("aria-pressed",hideWatched);render()};
wEdit.onclick=()=>{wPanel.hidden=!wPanel.hidden;if(!wPanel.hidden){wTa.value=watchedRaw.join("\n");wStat.textContent=wcount()+" currently matched"}};
wSave.onclick=()=>{wsave(wTa.value);wStat.textContent=wcount()+" of "+watchedRaw.length+" matched";render()};
wClear.onclick=()=>{wTa.value="";wsave("");wStat.textContent="cleared";render()};
const toTop=document.getElementById("toTop"),toBot=document.getElementById("toBot"),pgUp=document.getElementById("pgUp"),pgDn=document.getElementById("pgDn");
var step=function(){return Math.round(innerHeight*0.85)};
toTop.onclick=function(){scrollTo({top:0,behavior:"smooth"})};
toBot.onclick=function(){scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
pgUp.onclick=function(){scrollBy({top:-step(),behavior:"smooth"})};
pgDn.onclick=function(){scrollBy({top:step(),behavior:"smooth"})};
function scb(){var y=scrollY,max=document.body.scrollHeight-innerHeight;toTop.hidden=y<300;pgUp.hidden=y<120;toBot.hidden=y>max-300;pgDn.hidden=y>max-120}
addEventListener("scroll",scb,{passive:true});scb();
const modal=document.getElementById("modal"),mbox=document.getElementById("mbox"),mbg=document.getElementById("mbg");
function openModal(i){var d=DATA[i];if(!d)return;
var poster=d.img?('<img class="mposter" src="'+d.img+'" alt="">'):('<div class="mposter-ph" style="background:'+ph(d.t)+'">'+esc(d.t)+'</div>');
var meta=[];if(d.y)meta.push('<span class="mchip">'+d.y+'</span>');if(d.cert)meta.push('<span class="mchip">'+esc(d.cert)+'</span>');if(d.rt)meta.push('<span class="mchip">'+d.rt+' min</span>');if(d.r)meta.push('<span class="mchip">\u2605 '+(Math.round(d.r*10)/10)+'</span>');(d.g||[]).forEach(function(g){meta.push('<span class="mchip">'+esc(g)+'</span>')});
var html='<button class="mclose" id="mclose" aria-label="Close">\u00d7</button><div class="mtop">'+poster+'<div><h2 class="mh1">'+esc(d.t)+'</h2>'+((d.ot&&d.ot!==d.t)?'<p class="mot">'+esc(d.ot)+'</p>':'')+'<div class="mmeta">'+meta.join("")+'</div>'+(d.tag?'<p class="mtag">'+esc(d.tag)+'</p>':'')+'</div></div>';
if(d.p)html+='<p class="mplot">'+esc(d.p)+'</p>';
if((d.dir||[]).length)html+='<div class="mrow"><b>Director</b>'+d.dir.map(esc).join(", ")+'</div>';
if((d.cast||[]).length)html+='<div class="mrow"><b>Cast</b>'+d.cast.map(function(a){return esc(a.n)+(a.r?' <span style="color:var(--dim)">as '+esc(a.r)+'</span>':'')}).join(", ")+'</div>';
if((d.co||[]).length)html+='<div class="mrow"><b>Country</b>'+d.co.map(esc).join(", ")+'</div>';
if(d.coll)html+='<div class="mrow"><b>Collection</b>'+esc(d.coll)+'</div>';
var btns=[];var imdbUrl=d.im?("https://www.imdb.com/title/"+d.im+"/"):d.link;
btns.push('<a class="mbtn2" href="'+imdbUrl+'" target="_blank" rel="noopener">IMDb \u2197</a>');
if(d.tm)btns.push('<a class="mbtn2" href="https://www.themoviedb.org/movie/'+d.tm+'" target="_blank" rel="noopener">TMDB \u2197</a>');
btns.push('<a class="mbtn2" href="https://www.youtube.com/results?search_query='+encodeURIComponent(d.t+" "+(d.y||"")+" trailer")+'" target="_blank" rel="noopener">\u25b6 Trailer</a>');
var pkd=picks.has(pickKey(d));btns.push('<button class="mbtn2 pickbtn'+(pkd?" on":"")+'">'+(pkd?"\u2605 In picks":"\u2606 Add to picks")+'</button>');
html+='<div class="mbtns">'+btns.join("")+'</div>';
var rv=reviews[pickKey(d)]||{rating:0,note:""};
html+='<div class="review"><h4>Your review (saved on this device)</h4><div class="stars" id="mstars">'+[1,2,3,4,5].map(function(n){return '<span data-n="'+n+'" class="'+(n<=(rv.rating||0)?"on":"")+'">\u2605</span>'}).join("")+'</div><textarea id="mnote" placeholder="Add a note\u2026">'+esc(rv.note||"")+'</textarea><div><button class="rsave" id="rsave">Save</button><span class="rstat" id="rstat"></span></div></div>';
mbox.innerHTML=html;modal.hidden=false;mbox.scrollTop=0;
document.getElementById("mclose").onclick=closeModal;
mbox.querySelector(".pickbtn").onclick=function(){togglePick(i);var on=picks.has(pickKey(d));this.className="mbtn2 pickbtn"+(on?" on":"");this.textContent=on?"\u2605 In picks":"\u2606 Add to picks"};
var curRating=rv.rating||0;var stars=mbox.querySelectorAll("#mstars span");stars.forEach(function(s){s.onclick=function(){var n=+s.dataset.n;curRating=(curRating===n)?0:n;stars.forEach(function(x){x.className=(+x.dataset.n<=curRating)?"on":""})}});
document.getElementById("rsave").onclick=function(){var k=pickKey(d);var nt=document.getElementById("mnote").value.trim();if(curRating||nt)reviews[k]={rating:curRating,note:nt};else delete reviews[k];saveReviews();document.getElementById("rstat").textContent="saved \u2713";render()};
}
function closeModal(){modal.hidden=true;mbox.innerHTML=""}
mbg.addEventListener("click",closeModal);document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!modal.hidden)closeModal()});
var picksBtn=document.getElementById("picksBtn");updatePicksBtn();
picksBtn.onclick=function(){picksView=!picksView;picksBtn.setAttribute("aria-pressed",picksView);render()};
var moreBtn=document.getElementById("moreBtn"),moreRow=document.getElementById("moreRow"),toWatchBtn=document.getElementById("toWatchBtn");
moreBtn.onclick=function(){moreRow.hidden=!moreRow.hidden;moreBtn.setAttribute("aria-pressed",!moreRow.hidden)};
var twCount=DATA.filter(function(d){return d.tw}).length;toWatchBtn.textContent="\u25b6 To watch ("+twCount+")";
toWatchBtn.onclick=function(){toWatchView=!toWatchView;toWatchBtn.setAttribute("aria-pressed",toWatchView);render()};
var _pt=null,_lf=false;
main.addEventListener("pointerdown",function(e){var c=e.target.closest(".card");if(!c)return;_lf=false;_pt=setTimeout(function(){_lf=true;togglePick(+c.dataset.i);if(navigator.vibrate)navigator.vibrate(25)},450)});
main.addEventListener("pointerup",function(){clearTimeout(_pt)});
main.addEventListener("pointermove",function(){clearTimeout(_pt)});
main.addEventListener("pointercancel",function(){clearTimeout(_pt)});
main.addEventListener("click",function(e){var c=e.target.closest(".card");if(!c)return;if(_lf){_lf=false;return}openModal(+c.dataset.i)});
main.addEventListener("keydown",function(e){if((e.key==="Enter")&&e.target.classList&&e.target.classList.contains("card")){e.preventDefault();openModal(+e.target.dataset.i)}});
</script></body></html>
